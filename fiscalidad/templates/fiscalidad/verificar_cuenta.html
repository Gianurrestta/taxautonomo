<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de Seguridad - Plataforma Autónomos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .verification-container { max-width: 450px; width: 100%; background: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; }
        p { color: #7f8c8d; font-size: 14px; text-align: center; line-height: 1.5; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center; font-size: 18px; font-weight: bold; letter-spacing: 4px; }
        .btn-submit { background: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #2980b9; }
        .error-msg { background: #fadbd8; color: #c0392b; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="verification-container">
        <h2>🔐 Verificación de Identidad</h2>
        <p>Por motivos de seguridad y Ley Antifraude, hemos enviado dos códigos secretos de 6 dígitos de un solo uso. Introduce ambos para activar tu cuenta.</p>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="codigo_email">📨 Código enviado a tu Email ({{ correo_destino }}):</label>
                <input type="text" id="codigo_email" name="codigo_email" placeholder="000000" maxlength="6" required>
            </div>
            <div class="form-group">
                <label for="codigo_sms">📱 Código enviado por SMS a tu Móvil ({{ telefono_destino }}):</label>
                <input type="text" id="codigo_sms" name="codigo_sms" placeholder="000000" maxlength="6" required>
            </div>
            <button type="submit" class="btn-submit">✅ Validar y Activar Mi Cuenta</button>
        </form>
    </div>
</body>
</html>
